name: Compilar agente de huella

# Se dispara A MANO desde la pestaña "Actions" de GitHub (botón "Run workflow").
# No corre en cada push a propósito: así no falla en rojo antes de que estén
# puestos los secrets. Cuando todo funcione, se le puede agregar un trigger push.
on:
  workflow_dispatch:

permissions:
  contents: write # para publicar el .exe como Release

jobs:
  build:
    runs-on: windows-latest # el agente es de Windows (DigitalPersona)
    steps:
      - uses: actions/checkout@v4

      - name: Instalar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # DPUruNet viene de NuGet (ver el .csproj): `dotnet publish` lo restaura solo.
      # Se compila como CARPETA autocontenida (NO single-file) y se empaqueta en un
      # .zip: Windows/Edge bloquean un .exe suelto sin firma ("no se descarga
      # habitualmente" / lo borran), pero un .zip se descarga sin pelea. El gym
      # descomprime y corre SalaAgente.exe con un solo "Ejecutar de todos modos".
      - name: Compilar (carpeta autocontenida)
        working-directory: agente-huella
        run: dotnet publish -c Release -r win-x64 --self-contained true -o publish

      - name: Empaquetar como .zip
        working-directory: agente-huella
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath SalaAgente.zip -Force

      # Respaldo: el .zip queda descargable desde la página de esta corrida.
      - name: Guardar como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SalaAgente
          path: agente-huella/SalaAgente.zip

      # La descarga PÚBLICA para los gyms: un Release con tag fijo 'agente', así la
      # URL nunca cambia y el botón de Lectores siempre apunta a la última versión.
      - name: Publicar el .zip como Release (URL pública estable)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agente
          name: Agente de huella SALA
          body: Agente del lector de huella (.zip). Descomprímelo y corre SalaAgente.exe.
          files: agente-huella/SalaAgente.zip
