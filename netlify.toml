[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Reescribe el <head> del HTML con la marca del tenant (nombre, imagen, color)
# ANTES de servirlo. Los bots de preview (WhatsApp, iMessage) no ejecutan JS, así
# que sin esto el link de cualquier gym se comparte con el logo y el texto de SALA.
[[edge_functions]]
  function = "tenant-meta"
  path = "/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

[[scheduled_functions]]
  name = "cron-no-shows"
  cron = "0 * * * *"

[[scheduled_functions]]
  name = "cron-expirar-membresias"
  cron = "0 7 * * *"

[[scheduled_functions]]
  name = "cron-recordatorios"
  cron = "*/15 * * * *"

# Reparte por push las notificaciones pendientes (de cualquier origen).
[[scheduled_functions]]
  name = "cron-push"
  cron = "* * * * *"

# Avisa al socio 3 días antes de que su plan venza.
[[scheduled_functions]]
  name = "cron-membresias-por-vencer"
  cron = "0 8 * * *"
