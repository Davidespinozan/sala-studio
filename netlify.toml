[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Reescribe el <head> del HTML con la marca del tenant (nombre, imagen, color)
# ANTES de servirlo. Los bots de preview (WhatsApp, iMessage) no ejecutan JS, así
# que sin esto el link de cualquier gym se comparte con el logo y el texto de SALA.
[[edge_functions]]
  function = "tenant-meta"
  path = "/*"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(), geolocation=()"

# ── Crons ────────────────────────────────────────────────────────────────────
# OJO: la sintaxis de Netlify para funciones programadas es [functions."nombre"]
# con `schedule`. El bloque [[scheduled_functions]] que había antes NO existe en
# Netlify: lo ignoraba en silencio y ningún cron corrió jamás (E: 53 membresías
# vencidas sin expirar en numa). Verificar tras el deploy que cada función diga
# "Scheduled" en el panel de Netlify.

[functions."cron-no-shows"]
  schedule = "0 * * * *"

[functions."cron-expirar-membresias"]
  schedule = "0 7 * * *"

[functions."cron-recordatorios"]
  schedule = "*/15 * * * *"

# Reparte por push las notificaciones pendientes (de cualquier origen).
[functions."cron-push"]
  schedule = "* * * * *"

# Avisa al socio 3 días antes de que su plan venza.
[functions."cron-membresias-por-vencer"]
  schedule = "0 8 * * *"

# Felicita por cumpleaños (≈9am hora de México = 15:00 UTC).
[functions."cron-felicitaciones"]
  schedule = "0 15 * * *"
